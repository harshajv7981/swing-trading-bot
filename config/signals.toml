# Which swarm calls become paper orders (swingbot-risk orders). These are
# filters in front of the risk engine: they can only skip a call, never loosen
# a limit in config/risk.toml, which the gate still checks on every order.
# Like risk.toml, change a value by hand in a commit of its own.

[filters]
min_confidence = 0.60             # skip calls the swarm is less sure of than this
defensive_min_confidence = 0.75   # the bar when the market mood is defensive (R11 also halves the size)
skip_when_mood_unknown = false    # true: no new entries while the mood is unknown or not checked
min_horizon_hours = 24            # shorter than a session is not a swing trade
max_horizon_hours = 480           # 20 sessions; longer calls are skipped, not stretched
max_signal_age_hours = 36         # a call older than this at decision time is stale

[technicals]
require_above_sma200 = true       # the long trend line (the gate's R8 checks it too)
require_above_sma50 = false       # the medium trend line
max_rsi = 75.0                    # RSI14 above this is chasing an overbought stock
max_extension_atr = 3.0           # close more than this many ATRs above EMA10 is chasing

[exits]
stop_rule = "atr:2"               # as in swingbot-risk plan: atr:K, pct:X or low:N
target_rule = "2R"                # a multiple of the stop distance, or price:X

[batch]
max_new_orders = 3                # at most this many tickets per run, best calls first
min_order_value = 10000.0         # rupees; a smaller order (cash or limits nearly used up) is skipped
