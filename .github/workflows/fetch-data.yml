# Fetch news (GDELT bulk files) and prices (Yahoo) on GitHub's servers, so the
# big download never touches your own connection. Start it by hand from the
# Actions tab ("Fetch data" > Run workflow). The results are uploaded as a run
# artifact named "swingbot-data" (a few MB): data/raw/news/events.csv and
# data/raw/prices/*.csv. Nothing is committed.
#
# Fetch it with:  gh run download --repo harshajv7981/swing-trading-bot --name swingbot-data --dir .
#
# It also runs by itself twice a day, news only, for yesterday and today (UTC),
# uploaded as "swingbot-news-daily": at 22:00 IST after the close, and at 07:30
# IST so the 08:30 daily loop sees the overnight and pre-market news. The daily
# refresh pulls that one with `swingbot-refresh --news-source github` (or
# news_source = "github" under [refresh] in config/data_sources.toml). GitHub
# turns scheduled workflows off after 60 days without activity in the repo;
# re-enable it from the Actions tab if the refresh reports the file is stale.
#
# The repo is public, so anyone signed in to GitHub can download the artifact.
# That is fine for GDELT headlines and Yahoo prices; never add NSE filings here
# (NSE's terms forbid sharing them).
name: Fetch data

on:
  schedule:
    - cron: "30 16 * * *"   # 22:00 IST, after the close; GitHub may start it some minutes late
    - cron: "0 2 * * *"     # 07:30 IST, an hour before the daily loop's 08:30 start
  workflow_dispatch:
    inputs:
      start:
        description: "First news day (UTC), YYYY-MM-DD"
        required: true
        default: "2026-07-01"
      end:
        description: "Last news day (UTC), YYYY-MM-DD"
        required: true
      prices_start:
        description: "First price day; the mood's 200-day check needs ~10 months before the first test day"
        required: true
        default: "2025-07-01"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[data]"
      - name: Prices
        if: github.event_name == 'workflow_dispatch'  # the nightly run is news only; the Mac refreshes prices
        continue-on-error: true  # the news still runs if Yahoo has a bad day
        run: |
          python scripts/fetch_prices.py --tickers $(tail -n +2 data/universe/nifty100.csv | cut -d, -f1) \
            --start "${{ inputs.prices_start }}" --end "$(date -u -d "${{ inputs.end }} + 1 day" +%F)" \
            --out data/raw/prices --mood
      - name: News
        run: |
          # A scheduled run has no inputs: yesterday and today (UTC). Today's later
          # batches don't exist yet and are skipped; the next night fetches them.
          start="${{ inputs.start }}"; end="${{ inputs.end }}"
          python scripts/fetch_gdelt_bulk.py --universe data/universe/nifty100.csv \
            --start "${start:-$(date -u -d yesterday +%F)}" --end "${end:-$(date -u +%F)}" \
            --workers 8 --out data/raw/news/events.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event_name == 'schedule' && 'swingbot-news-daily' || 'swingbot-data' }}
          path: |
            data/raw/news/events.csv
            data/raw/news/events.csv.gkg_days.json
            data/raw/prices/
          retention-days: ${{ github.event_name == 'schedule' && 14 || 90 }}
