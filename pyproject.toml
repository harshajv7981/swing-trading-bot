[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swingbot"
version = "0.1.0"
description = "NSE swing trading toolkit: risk rules, paper broker, Dhan sandbox adapter and the mid-cap momentum paper trial."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
swingbot-data = "swingbot.data.cli:main"
swingbot-refresh = "swingbot.data.refresh:main"
swingbot-risk = "swingbot.risk.cli:main"
swingbot-paper = "swingbot.paper.cli:main"
swingbot-dhan = "swingbot.broker.dhan_cli:main"
swingbot-dashboard = "swingbot.dashboard:main"
swingbot-momentum = "swingbot.momentum:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
