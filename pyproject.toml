[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swingbot"
version = "0.1.0"
description = "NSE swing trading toolkit: risk rules, paper broker, Dhan sandbox adapter, the mid-cap momentum paper trial, and the US/Alpaca paper adapter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=8", "TA-Lib>=0.6"]  # TA-Lib: only for the indicator cross-check test
# The large-cap test's API run (`swingbot-agent-calls run`); needs ANTHROPIC_API_KEY. `agents` brings it too.
api = ["anthropic"]
# TradingAgents paper test (docs/research/tradingagents-paper-test.md); needs ANTHROPIC_API_KEY.
agents = ["tradingagents @ git+https://github.com/TauricResearch/TradingAgents@v0.7.1"]

[project.scripts]
swingbot-data = "swingbot.data.cli:main"
swingbot-refresh = "swingbot.data.refresh:main"
swingbot-risk = "swingbot.risk.cli:main"
swingbot-paper = "swingbot.paper.cli:main"
swingbot-dhan = "swingbot.broker.dhan_cli:main"
swingbot-dashboard = "swingbot.dashboard:main"
swingbot-momentum = "swingbot.momentum:main"
swingbot-agents = "swingbot.agents_trial:main"
swingbot-agent-calls = "swingbot.agent_calls:main"
swingbot-markets = "swingbot.markets.cli:main"
swingbot-us-momentum = "swingbot.us_momentum:main"
swingbot-us-research = "swingbot.us_research:main"
swingbot-real = "swingbot.realpos:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
